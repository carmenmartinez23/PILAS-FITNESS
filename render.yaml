services:
  - type: web
    name: fitflow-web
    runtime: python
    region: frankfurt
    plan: 1c-2g
    numInstances: 2
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 3 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitflow-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: BUSINESS_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: fitflow-db
    region: frankfurt
    plan: 1c-2g
    databaseName: fitflow
    user: fitflow
    diskSizeGB: 10
    connectionPool: pgbouncer
    storageAutoscalingEnabled: true
