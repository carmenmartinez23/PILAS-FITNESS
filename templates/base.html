<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}REVITALÍZATE · Entrena a tu ritmo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
</head>

<body>
  <header class="nav"><a class="brand" href="{{ url_for('index') }}">
    <span class="brand-logo">
      <img src="https://raw.githubusercontent.com/carmenmartinez23/PILAS-FITNESS/carmenmartinez23/Logo%20Cuadrado%20_%20R_1.png" alt="REVITALÍZATE">
    </span> REVITALÍZATE</a>
  </header>
  <main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div
      class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
  <footer>REVITALÍZATE <span>·</span> Mueve el cuerpo. Cambia el día.</footer>
  {% if g.user %}<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { firebaseConfig } from "{{ url_for('static', filename='firebase-config.js') }}";
    const auth = getAuth(initializeApp(firebaseConfig));
    document.getElementById("logout-form").addEventListener("submit", () => { signOut(auth).catch(() => {}); });
  </script>{% endif %}
  {% block scripts %}{% endblock %}
</body>

</html>
